# One channel: build (or reuse) the image, smoke-test it, and on the default branch or a
# git tag add the release tags. Called by ci.yml once per channel.
#
# Every non-PR run pushes :<commit>-<channel>; `release` adds the other tags after the
# tests pass. Pull requests build and test locally and push nothing.
name: Image

on:
  workflow_call:
    inputs:
      channel:
        description: unstable (submodules as pinned) or stable (newest upstream releases)
        required: true
        type: string

permissions:
  contents: read

env:
  CHANNEL: ${{ inputs.channel }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      build_key: ${{ steps.key.outputs.key }}
      ref: ${{ steps.key.outputs.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history of this repo for `git describe`

      # By hand: the checkout action's `submodules` would fetch the full Bio-Formats history
      - name: Check out submodules
        run: git submodule update --init --recursive --depth 1

      - name: Check out newest upstream releases
        if: inputs.channel == 'stable'
        run: scripts/checkout-releases.sh

      - name: Set up registry
        uses: ./.github/actions/setup-registry
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The build key covers everything that goes into the image: the submodule commits,
      # the Temurin runtime image and the build files. `release` appends it to the
      # version tag, so an image that was already tested and released with this key is
      # reused instead of rebuilt.
      - name: Compute build key
        id: key
        env:
          SHA: ${{ github.sha }}
        run: |
          key=$(scripts/build-key.sh)
          existing=$(regctl tag ls "${IMAGE}" 2>/dev/null | grep -- "_build${key}\$" | head -n 1 || true)
          target="${IMAGE}:${SHA::7}-${CHANNEL}"
          {
            echo "key=${key}"
            echo "existing=${existing}"
            echo "target=${target}"
          } >> "${GITHUB_OUTPUT}"
          if [ "${PUSH}" = true ]; then ref="${target}"; else ref="bioformats-conversion:pr-${CHANNEL}"; fi
          echo "REF=${ref}" >> "${GITHUB_ENV}"
          echo "Build key ${key}${existing:+, already released as :${existing}}"

      - name: Reuse released image
        if: steps.key.outputs.existing != ''
        env:
          EXISTING: ${{ steps.key.outputs.existing }}
        run: |
          echo "Reusing :${EXISTING}"
          if [ "${PUSH}" = true ]; then
            regctl image copy "${IMAGE}:${EXISTING}" "${REF}"
          else
            echo "REF=${IMAGE}:${EXISTING}" >> "${GITHUB_ENV}"
          fi

      # Source revisions (/opt/VERSIONS, image labels) become build args
      - name: Collect build args
        id: args
        if: steps.key.outputs.existing == ''
        run: |
          . ./build.env
          {
            echo 'build-args<<EOF'
            echo "JAVA_VERSION=${JAVA_VERSION}"
            scripts/revisions.sh
            echo 'EOF'
          } | tee -a "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        if: steps.key.outputs.existing == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Base images are always pulled, so this gets the newest Temurin release. The
      # registry cache only skips stages whose inputs (base image digest, submodule
      # sources) are unchanged. Local context: the Git context would miss the
      # submodules and the stable checkouts.
      - name: Build image
        id: build
        if: steps.key.outputs.existing == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          build-args: ${{ steps.args.outputs.build-args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ inputs.channel }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE, inputs.channel) || '' }}
          provenance: false
          sbom: false
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ env.REF }}

      # Runs the image as a non-root user, as Nextflow may
      - name: Smoke test
        run: docker run --rm --user 65534:65534 -e HOME=/tmp "${REF}" /opt/tests/smoke.sh

      # Attest only new, tested images; a reused image was attested when it was built
      - name: Generate SBOM
        if: env.PUSH == 'true' && steps.build.outputs.digest != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        if: env.PUSH == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        if: env.PUSH == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Summary
        env:
          KEY: ${{ steps.key.outputs.key }}
          EXISTING: ${{ steps.key.outputs.existing }}
        run: |
          {
            echo "### ${CHANNEL}"
            echo
            echo "- Image: \`${REF}\`"
            echo "- Build key: \`${KEY}\`${EXISTING:+ (reused \`:${EXISTING}\`)}"
            echo
            echo '```text'
            docker run --rm "${REF}" cat /opt/VERSIONS
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # Retag the tested image (manifest copy, no rebuild):
  #   default branch: :latest-<channel> (stable also :latest)
  #   git tag:        :<git tag>-<channel>
  #   both:           the version tag from scripts/version-tag.sh
  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            scripts

      - name: Set up registry
        uses: ./.github/actions/setup-registry
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release tags
        env:
          REF: ${{ needs.build.outputs.ref }}
          BUILD_KEY: ${{ needs.build.outputs.build_key }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version_tag=$(scripts/version-tag.sh "${REF}" "${BUILD_KEY}")
          if [ "${REF_TYPE}" = tag ]; then tags="$(printf '%s' "${REF_NAME}" | tr -c 'A-Za-z0-9_.-' '-')-${CHANNEL}"
          elif [ "${CHANNEL}" = stable ]; then tags="latest-stable latest"
          else tags="latest-${CHANNEL}"; fi
          echo "### ${CHANNEL} release tags" >> "${GITHUB_STEP_SUMMARY}"
          for t in ${tags} "${version_tag}"; do
            regctl image copy "${REF}" "${IMAGE}:${t}"
            echo "- \`${IMAGE}:${t}\`" >> "${GITHUB_STEP_SUMMARY}"
          done
